<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Faust Demo</title>
  <style>
    body { font-family: monospace; background: #1e1e1e; color: #d4d4d4; padding: 20px; }
    h2 { color: #4ec9b0; margin-bottom: 10px; }
    .box { background: #252526; border: 1px solid #3c3c3c; border-radius: 6px; padding: 14px; margin-bottom: 16px; min-height: 120px; max-height: 260px; overflow-y: auto; }
    .line { margin: 3px 0; }
    .ok     { color: #4ec9b0; }
    .failed { color: #f44747; }
    .retry  { color: #ce9178; }
    .system { color: #888; }
    .stats { display: flex; gap: 20px; margin-bottom: 16px; }
    .stat { background: #252526; border: 1px solid #3c3c3c; border-radius: 6px; padding: 12px 20px; text-align: center; }
    .stat-num { font-size: 28px; font-weight: bold; color: #4ec9b0; }
    .stat-label { font-size: 12px; color: #888; margin-top: 4px; }
    .stat-num.red { color: #f44747; }
    .stat-num.orange { color: #ce9178; }
  </style>
</head>
<body>

<h2>🟢 Faust Streaming Dashboard — Dép Store</h2>

<div class="stats">
  <div class="stat"><div class="stat-num" id="cnt-ok">0</div><div class="stat-label">✅ Thành công</div></div>
  <div class="stat"><div class="stat-num red" id="cnt-fail">0</div><div class="stat-label">❌ Lỗi</div></div>
  <div class="stat"><div class="stat-num orange" id="cnt-retry">0</div><div class="stat-label">🔄 Retry</div></div>
  <div class="stat"><div class="stat-num" id="cnt-worker">0</div><div class="stat-label">⚙️ Workers</div></div>
</div>

<h2>⚙️ Workers</h2>
<div class="box" id="box-worker"></div>

<h2>📦 Đơn hàng</h2>
<div class="box" id="box-order"></div>

<h2>🔄 Retry</h2>
<div class="box" id="box-retry"></div>

<script>
async function refresh() {
  const res = await fetch('/log');
  const text = await res.text();
  const lines = text.trim().split('\n').filter(Boolean);

  let workers = [], orders = [], retries = [];
  let cntOk = 0, cntFail = 0, cntRetry = 0, workerSet = new Set();

  lines.forEach(line => {
    if (line.startsWith('[SYSTEM]')) {
      workers.push(`<div class="line system">${line}</div>`);
      const m = line.match(/\[SYSTEM\] (.+) started/);
      if (m) workerSet.add(m[1]);
    } else if (line.startsWith('[OK]')) {
      orders.push(`<div class="line ok">${line}</div>`);
      cntOk++;
    } else if (line.startsWith('[FAILED]')) {
      orders.push(`<div class="line failed">${line}</div>`);
      cntFail++;
    } else if (line.startsWith('[RETRY')) {
      retries.push(`<div class="line retry">${line}</div>`);
      if (line.startsWith('[RETRY]')) cntRetry++;
    }
  });

  document.getElementById('box-worker').innerHTML = workers.join('') || '<div class="system">Chưa có worker...</div>';
  document.getElementById('box-order').innerHTML  = orders.join('')  || '<div class="system">Chưa có đơn hàng...</div>';
  document.getElementById('box-retry').innerHTML  = retries.join('') || '<div class="system">Chưa có retry...</div>';

  document.getElementById('cnt-ok').textContent     = cntOk;
  document.getElementById('cnt-fail').textContent   = cntFail;
  document.getElementById('cnt-retry').textContent  = cntRetry;
  document.getElementById('cnt-worker').textContent = workerSet.size;

  // auto scroll xuống cuối
  ['box-worker','box-order','box-retry'].forEach(id => {
    const el = document.getElementById(id);
    el.scrollTop = el.scrollHeight;
  });
}

refresh();
setInterval(refresh, 2000);
</script>

</body>
</html>
